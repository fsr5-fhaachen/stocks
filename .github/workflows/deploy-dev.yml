name: Deploy dev

# Dev instance (https://stocks-dev.proxy.sntg.eu): every push to "dev" builds the image on a
# GitHub runner and deploys it with the self-hosted runner on the dev server (label
# "stocks-dev"), so the server needs no incoming connection. Setup: documentation/DEPLOY.md.
# A failed run stays failed: no schedule, no automatic retry. "Re-run jobs" or "Run workflow"
# starts it again by hand.
on:
  push:
    branches:
      - dev
  workflow_dispatch: {}

env:
  # lower case, docker does not accept upper case letters
  IMAGE: ghcr.io/fsr5-fhaachen/stocks
  DEPLOY_DIR: /opt/stocks-dev
  COMPOSE_PROJECT_NAME: stocks-dev

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # a newer push to dev replaces a build that is still running
    concurrency:
      group: deploy-dev-build
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          # one image per commit; re-running an old deploy brings back exactly that version
          tags: ${{ env.IMAGE }}:${{ github.sha }}, ${{ env.IMAGE }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, stocks-dev]
    timeout-minutes: 15
    # never two deploys at the same time, and a running deploy is never cancelled
    concurrency:
      group: deploy-dev-server
      cancel-in-progress: false
    environment:
      name: dev
      url: https://stocks-dev.proxy.sntg.eu
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Write compose files and .env
        env:
          STOCKS_DEV_ENV: ${{ secrets.STOCKS_DEV_ENV }}
        run: |
          if [ -z "$STOCKS_DEV_ENV" ]; then
            echo "Secret STOCKS_DEV_ENV of the environment dev is missing, see documentation/DEPLOY.md"
            exit 1
          fi
          # compose files of this commit, .env from GitHub plus the image of this commit
          cp docker-compose.yaml "$DEPLOY_DIR/docker-compose.yaml"
          cp deploy/dev/docker-compose.override.yaml "$DEPLOY_DIR/docker-compose.override.yaml"
          umask 077
          printf '%s\n' "$STOCKS_DEV_ENV" > "$DEPLOY_DIR/.env"
          printf '\nSTOCKS_IMAGE=%s\n' "$IMAGE:$GITHUB_SHA" >> "$DEPLOY_DIR/.env"
      - name: Start
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          # only the own image; mariadb, redis and minio are updated by hand (see DEPLOY.md)
          docker compose pull web queue scheduler
          # migrations and stocks:sync run when "web" starts
          docker compose up -d --remove-orphans
      - name: Wait until web is healthy
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          # waits up to 3 minutes; this is a wait, not a retry of the deploy
          for i in $(seq 1 36); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q web)")
            if [ "$status" = "healthy" ]; then echo "web is healthy"; exit 0; fi
            sleep 5
          done
          docker compose logs --tail=100 web
          exit 1
      - name: Remove old images
        if: always()
        # images of older deploys (one per commit) older than a week; images in use stay,
        # so a re-run of a recent deploy needs no download
        run: docker image prune -af --filter "until=168h"
