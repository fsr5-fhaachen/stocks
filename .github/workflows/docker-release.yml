name: Docker Release

# Builds the image of a published release. Drafts never trigger "published"; a pre-release gets
# its own tag but never "latest". "latest" only moves when this release is the newest full
# release, so a hotfix for an old version does not replace it. The dev image comes from
# deploy-dev.yml. A failed run stays failed, nothing restarts it.
on:
  release:
    types:
      - published

concurrency:
  group: docker-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # lower case, docker does not accept upper case letters
  IMAGE: ghcr.io/fsr5-fhaachen/stocks

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Choose tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          tags="$IMAGE:$TAG"
          if [ "$PRERELEASE" = "false" ]; then
            # newest release that is neither draft nor pre-release; empty if there is none
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
            if [ "$latest" = "$TAG" ]; then
              tags="$tags,$IMAGE:latest"
            fi
          fi
          echo "Tags: $tags"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # version below the menu: the tag of the release (App\Support\AppVersion)
          build-args: STOCKS_VERSION=${{ github.event.release.tag_name }}
