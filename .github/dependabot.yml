version: 2
updates:
  # PHP packages: one pull request for minor and patch updates, one for majors
  - package-ecosystem: "composer"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Berlin"
    groups:
      composer-minor:
        update-types: ["minor", "patch"]
      composer-major:
        update-types: ["major"]

  # frontend packages, grouped the same way
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Berlin"
    ignore:
      # Tailwind 4 changes the configuration and the PostCSS plugin and needs newer browsers:
      # its own round (documentation/DECISIONS.md)
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor:
        update-types: ["minor", "patch"]
      npm-major:
        update-types: ["major"]

  # workflows: all actions in one pull request
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Berlin"
    groups:
      actions:
        patterns: ["*"]
